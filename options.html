<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Canvas AI Helper - Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 20px;
      color: #e66000;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 4px;
    }
    input:focus {
      outline: none;
      border-color: #e66000;
    }
    .hint {
      font-size: 12px;
      color: #666;
      margin-bottom: 16px;
    }
    button {
      background: #e66000;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #c55400; }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #2e7d32;
    }
    .show-toggle {
      font-size: 12px;
      color: #666;
      cursor: pointer;
      user-select: none;
      margin-bottom: 16px;
      display: inline-block;
    }
    .show-toggle:hover { color: #e66000; }
  </style>
</head>
<body>
  <h1>Canvas AI Helper — Settings</h1>

  <label for="apiKey">Anthropic API Key</label>
  <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
  <span class="show-toggle" id="toggleShow">Show / Hide</span>
  <p class="hint">
    Get your key at
    <a href="https://console.anthropic.com/settings/api-keys" target="_blank">console.anthropic.com</a>.
    It is stored locally in Chrome's sync storage and never sent anywhere except the Anthropic API.
  </p>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
